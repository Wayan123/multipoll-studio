[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "multipoll-studio"
version = "0.1.0"
description = "Open-source Modbus master/poll tool: RTU, ASCII, TCP and UDP with a multi-window GUI"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MultiPoll Studio contributors" }]
keywords = ["modbus", "modbus-tcp", "modbus-rtu", "plc", "scada", "industrial"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Manufacturing",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
test = ["pytest>=8", "pymodbus>=3.8,<3.9"]

[project.scripts]
multipoll-studio = "multipoll_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multipoll_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
