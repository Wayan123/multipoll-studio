repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Scan staged changes for secrets
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: whitespace
        name: Check staged whitespace
        entry: git diff --cached --check
        language: system
        pass_filenames: false
